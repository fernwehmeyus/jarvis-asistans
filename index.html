
<script>
const orb = document.getElementById("orb");
const state = document.getElementById("state");
const messages = document.getElementById("messages");
const input = document.getElementById("input");

function updateTime() {
  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleTimeString("tr-TR");

  document.getElementById("headerClock").textContent =
    now.toLocaleTimeString("tr-TR", {
      hour: "2-digit",
      minute: "2-digit"
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString("tr-TR", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    });
}

updateTime();
setInterval(updateTime, 1000);

function addMessage(type, text) {
  const box = document.createElement("div");
  box.className = "msg " + type;

  const name = document.createElement("div");
  name.className = "msg-name";
  name.textContent = type === "user" ? "SİZ" : "JARVIS";

  const content = document.createElement("div");
  content.textContent = text;

  box.append(name, content);
  messages.appendChild(box);
  messages.scrollTop = messages.scrollHeight;

  return content;
}

function typeText(element, text) {
  return new Promise(resolve => {
    let i = 0;

    function next() {
      if (i < text.length) {
        element.textContent += text[i++];
        messages.scrollTop = messages.scrollHeight;
        setTimeout(next, 15);
      } else {
        resolve();
      }
    }

    next();
  });
}


async function sendMessage() {
  const text = input.value.trim();

  if (!text || busy) return;

  busy = true;
  addMessage("user", text);
  input.value = "";

  state.textContent = "JARVIS DÜŞÜNÜYOR";
  orb.className = "orb speaking";

  const reply = addMessage("jarvis", "");

  try {
    const response = await fetch(
      "https://jarvis-beyin.discordistiyom.workers.dev/",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: text
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Sunucu bağlantı hatası.");
    }

    await typeText(
      reply,
      data.reply || "Yanıt alınamadı efendim."
    );

  } catch (error) {
    await typeText(
      reply,
      "Bağlantı hatası efendim: " + error.message
    );

  } finally {
    state.textContent = "SİSTEM HAZIR";
    orb.className = "orb";
    busy = false;
  }
}

document.getElementById("send").onclick = sendMessage;

input.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    sendMessage();
  }
});

const Recognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

document.getElementById("mic").onclick = () => {
  if (!Recognition) {
    alert("Tarayıcınız ses tanımayı desteklemiyor.");
    return;
  }

  const rec = new Recognition();
  rec.lang = "tr-TR";

  rec.onstart = () => {
    state.textContent = "SİZİ DİNLİYORUM";
    orb.className = "orb listening";
  };

  rec.onresult = event => {
    input.value = event.results[0][0].transcript;
  };

  rec.onerror = () => {
    state.textContent = "SES ALGILANAMADI";
  };

  rec.onend = () => {
    orb.className = "orb";
    state.textContent = "SİSTEM HAZIR";
  };

  rec.start();
};
</script>
