
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS - Kişisel Asistan</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --cyan:#39eaff;
 --blue:#087fae;
 --bg:#050b12;
 --panel:#0a1520;
}
body{
 background:var(--bg);
 color:#d8faff;
 font-family:Arial,sans-serif;
 height:100vh;
 overflow:hidden;
}
.app{
 height:100vh;
 display:flex;
 flex-direction:column;
 padding:24px 38px;
 position:relative;
}
header{
 height:65px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 border-bottom:1px solid #39eaff25;
}
.logo{
 color:var(--cyan);
 font-size:22px;
 letter-spacing:7px;
 font-weight:300;
}
.connection{
 color:#75b7c6;
 font-size:12px;
}
.dot{
 display:inline-block;
 width:7px;height:7px;
 border-radius:50%;
 background:#35eacb;
 margin-right:9px;
 box-shadow:0 0 12px #35eacb;
}
main{
 flex:1;
 display:flex;
 align-items:center;
 justify-content:center;
 position:relative;
 min-height:0;
}
.core-area{
 display:flex;
 flex-direction:column;
 align-items:center;
}
.orb{
 width:min(340px,60vw);
 aspect-ratio:1;
 position:relative;
 display:grid;
 place-items:center;
}
.orb:before{
 content:"";
 position:absolute;
 inset:18%;
 border-radius:50%;
 background:radial-gradient(circle,
 #b4ffff 0%,#37dcff 8%,#0875ac 28%,
 #063453 53%,#020c18 75%);
 box-shadow:
 0 0 25px #29dfff,
 0 0 65px #008edb99,
 0 0 110px #006bba55,
 inset 0 0 35px #00cfff;
 animation:corePulse 4s ease-in-out infinite;
}
.orb:after{
 content:"";
 position:absolute;
 inset:25%;
 border-radius:50%;
 border:1px solid #a8faff99;
 box-shadow:inset 0 0 25px #00dfff66;
}
.ring{
 position:absolute;
 border:1px solid #30dfff77;
 border-radius:50%;
 inset:5%;
 animation:rotate 18s linear infinite;
}
.ring.r2{
 inset:12%;
 border-style:dashed;
 animation:rotate 13s linear infinite reverse;
}
.ring.r3{
 inset:0;
 border-color:#25bfff66;
 transform:scaleY(.48);
 animation:rotate 12s linear infinite;
}
.ring.r4{
 inset:0;
 border-color:#25bfff66;
 transform:scaleY(.48) rotate(90deg);
 animation:rotate 15s linear infinite reverse;
}
.particle{
 position:absolute;
 width:7px;height:7px;
 background:#b5ffff;
 border-radius:50%;
 box-shadow:0 0 14px #00eaff;
 top:14%;left:25%;
}
.p2{top:77%;left:76%;width:5px;height:5px}
.p3{top:32%;left:90%;width:4px;height:4px}
@keyframes rotate{
 to{rotate:360deg}
}
@keyframes corePulse{
 50%{transform:scale(1.08);filter:brightness(1.35)}
}
.orb.listening .ring,
.orb.speaking .ring{
 animation:wave 1.1s ease-in-out infinite alternate;
}
.orb.listening:before,
.orb.speaking:before{
 animation:corePulse .8s ease-in-out infinite;
}
.orb.listening .ring.r2,
.orb.speaking .ring.r2{
 animation:wave2 .8s ease-in-out infinite alternate;
}
.orb.speaking .ring{
 border-color:#9afaff;
 box-shadow:0 0 20px #00dfff88;
}
@keyframes wave{
 from{transform:scale(.91);opacity:.5}
 to{transform:scale(1.13);opacity:1}
}
@keyframes wave2{
 from{transform:scale(.88);opacity:.4}
 to{transform:scale(1.16);opacity:1}
}
.name{
 margin-top:30px;
 letter-spacing:8px;
 font-size:19px;
 color:#8df6ff;
}
.state{
 margin-top:12px;
 font-size:12px;
 color:#6599a8;
 letter-spacing:3px;
}
.chat{
 position:absolute;
 left:0;right:0;
 bottom:25px;
 margin:auto;
 width:min(650px,90%);
 display:flex;
 flex-direction:column;
 gap:15px;
}
.messages{
 max-height:150px;
 overflow-y:auto;
 font-size:14px;
 line-height:1.8;
 color:#c5edf2;
 text-align:center;
}
.message{padding:5px 10px}
.user{color:#69dbea}
.jarvis{color:#d7faff}
.controls{
 display:flex;
 gap:10px;
 background:#0b1722;
 border:1px solid #30dfff55;
 padding:8px;
 border-radius:40px;
}
input{
 flex:1;
 background:transparent;
 border:none;
 outline:none;
 color:white;
 padding:12px 17px;
 font-size:14px;
 min-width:0;
}
input::placeholder{color:#62818c}
button{
 border:0;
 cursor:pointer;
 color:#c9faff;
 background:#123448;
 border-radius:50%;
 width:43px;height:43px;
 font-size:18px;
}
button:hover{background:#087da2}
#send{background:#087da2}
footer{
 text-align:center;
 color:#426d7c;
 font-size:10px;
 letter-spacing:3px;
 padding-top:12px;
}
@media(max-width:650px){
 .app{padding:15px}
 .orb{width:min(280px,75vw)}
 .chat{bottom:15px}
 .name{font-size:16px}
}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="logo">J.A.R.V.I.S.</div>
 <div class="connection">
  <span class="dot"></span>
  <span id="connection">SİSTEM HAZIR</span>
 </div>
</header>

<main>
 <div class="core-area">
  <div class="orb" id="orb">
   <div class="ring"></div>
   <div class="ring r2"></div>
   <div class="ring r3"></div>
   <div class="ring r4"></div>
   <div class="particle"></div>
   <div class="particle p2"></div>
   <div class="particle p3"></div>
  </div>
  <div class="name">J.A.R.V.I.S.</div>
  <div class="state" id="state">SİZİ DİNLİYORUM</div>
 </div>

 <div class="chat">
  <div class="messages" id="messages">
   <div class="message jarvis">
    Merhaba efendim. Sistem hazır.
   </div>
  </div>
  <div class="controls">
   <button id="mic" title="Sesli konuş">🎙</button>
   <input id="input" placeholder="JARVIS'e bir şey sorun...">
   <button id="send" title="Gönder">➤</button>
  </div>
 </div>
</main>

<footer>KİŞİSEL YAPAY ZEKÂ ASİSTANINIZ</footer>
</div>

<script>
const orb=document.getElementById("orb");
const state=document.getElementById("state");
const messages=document.getElementById("messages");
const input=document.getElementById("input");

function addMessage(type,text){
 const div=document.createElement("div");
 div.className="message "+type;
 messages.appendChild(div);
 messages.scrollTop=messages.scrollHeight;
 return div;
}

function typeText(element,text){
 let i=0;
 return new Promise(resolve=>{
  function write(){
   if(i<text.length){
    element.textContent+=text[i++];
    messages.scrollTop=messages.scrollHeight;
    setTimeout(write,22);
   }else resolve();
  }
  write();
 });
}

async function sendMessage(){
 const text=input.value.trim();
 if(!text)return;
 addMessage("user","Siz: "+text);
 input.value="";
 state.textContent="İŞLENİYOR";
 orb.className="orb speaking";

 const reply=addMessage("jarvis","JARVIS: ");
 await typeText(reply,
 "Gemini bağlantısı henüz kurulmadı efendim. Bir sonraki aşamada gerçek yapay zekâ bağlantısını kuracağız.");
 state.textContent="SİSTEM HAZIR";
 orb.className="orb";
}

document.getElementById("send").onclick=sendMessage;
input.addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});

const Recognition=window.SpeechRecognition||
 window.webkitSpeechRecognition;

document.getElementById("mic").onclick=()=>{
 if(!Recognition){
  alert("Ses tanıma bu tarayıcıda desteklenmiyor.");
  return;
 }
 const recognition=new Recognition();
 recognition.lang="tr-TR";
 recognition.onstart=()=>{
  orb.className="orb listening";
  state.textContent="SİZİ DİNLİYORUM";
 };
 recognition.onresult=e=>{
  input.value=e.results[0][0].transcript;
 };
 recognition.onerror=()=>{
  state.textContent="SES ALGILANAMADI";
 };
 recognition.onend=()=>{
  orb.className="orb";
  state.textContent="SİSTEM HAZIR";
 };
 recognition.start();
};
</script>
</body>
</html>
