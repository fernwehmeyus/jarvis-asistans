
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050b14;color:#bceeff;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
main{width:min(650px,94%);text-align:center;padding:24px}
h1{letter-spacing:8px;color:#55dfff}
.core{width:145px;height:145px;border:3px solid #36dfff;border-radius:50%;margin:25px auto;box-shadow:0 0 25px #16bfff,inset 0 0 25px #16bfff;display:grid;place-items:center;font-size:42px}
#status{color:#8bbbd0;margin:18px}
#chat{height:260px;overflow:auto;text-align:left;border:1px solid #174b65;border-radius:12px;padding:14px;margin:20px 0;background:#071522}
input{width:75%;padding:14px;background:#0b1c2a;border:1px solid #2c9fc5;color:white;border-radius:8px}
button{padding:13px;background:#087eaa;color:white;border:0;border-radius:8px;margin:5px;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>J.A.R.V.I.S.</h1>
<div class="core">AI</div>
<div id="status">SİSTEMLER HAZIR</div>
<div id="chat">JARVIS: Merhaba efendim. Sistemlerim hazır.</div>
<input id="message" placeholder="Bir komut girin...">
<button onclick="send()">GÖNDER</button>
<button onclick="listen()">🎙️</button>
</main>
<script>
const chat=document.getElementById("chat");
const input=document.getElementById("message");
function say(text){
 if("speechSynthesis" in window){
  speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang="tr-TR";
  speechSynthesis.speak(utterance);
 }
}
function add(text){
 chat.innerHTML+="<p>"+text.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))+"</p>";
 chat.scrollTop=chat.scrollHeight;
}
function send(){
 const text=input.value.trim();
 if(!text)return;
 add("SİZ: "+text);
 input.value="";
 const answer="Komutunuzu aldım efendim. Yapay zekâ bağlantısı henüz kurulmadı.";
 add("JARVIS: "+answer);
 say(answer);
}
function listen(){
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){add("JARVIS: Tarayıcınız ses tanımayı desteklemiyor.");return;}
 const recognition=new SpeechRecognition();
 recognition.lang="tr-TR";
 recognition.onresult=e=>{input.value=e.results[0][0].transcript;send();};
 recognition.onerror=()=>add("JARVIS: Mikrofon kullanılamadı.");
 recognition.start();
}
</script>
</body>
</html>
